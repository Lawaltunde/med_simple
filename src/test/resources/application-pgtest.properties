# Profile for Testcontainers-backed integration tests (real PostgreSQL + Flyway).
# Datasource url/username/password are injected at runtime by PostgresIntegrationTest via
# @DynamicPropertySource. Everything here is the non-datasource config the context needs to boot.

# Flyway runs the real migrations; Hibernate validates against them.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# 32 zero bytes in Base64 — valid AES-256 key for tests only, never used in production.
encryption.key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

# JWT signing secret for tests only (must be >= 32 bytes for HS256).
jwt.secret=test-only-jwt-signing-secret-0123456789abcdefghijklmnop

# No background media poller in tests.
media.processing.poller.enabled=false

# Fallback AI adapters — no external calls during integration tests.
ai.triage.adapter=fallback
ai.safety.adapter=fallback
ai.referral.adapter=fallback
ai.result.adapter=fallback
ai.media.adapter=fallback
spring.ai.openai.api-key=not-set
