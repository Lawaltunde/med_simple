# Profile for compliance integration tests that need the REAL, Flyway-migrated PostgreSQL schema
# (audit_logs immutability triggers from V2, ciphertext written to a real column). Runs against the
# docker-compose dev Postgres on localhost:5333 — start it with `docker-compose up -d` first.
#
# These are the committed docker-compose dev defaults, NOT secrets: the dev DB holds only synthetic
# data and is never reachable from production. The tests insert UUID-unique rows, so repeated runs
# never collide, and audit_logs is append-only by design so its growth is expected.

spring.datasource.url=jdbc:postgresql://localhost:5333/medsimple
spring.datasource.username=medsimple
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns the schema; Hibernate only validates it. Proves the entities and the migrated tables
# agree — the same contract production runs under.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# 32 zero bytes in Base64 — valid AES-256 key for tests only, never used in production. The
# encryption test round-trips its OWN row with this key, so it is self-consistent regardless of
# what other rows in the dev DB were encrypted with.
encryption.key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

# JWT signing secret for tests only (must be >= 32 bytes for HS256).
jwt.secret=test-only-jwt-signing-secret-0123456789abcdefghijklmnop

# No background media poller in tests.
media.processing.poller.enabled=false

# Fallback AI adapters — no external calls during integration tests.
ai.triage.adapter=fallback
ai.safety.adapter=fallback
ai.referral.adapter=fallback
ai.result.adapter=fallback
ai.voice.adapter=fallback
ai.photo.adapter=fallback
spring.ai.openai.api-key=not-set
