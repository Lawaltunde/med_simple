# In-memory datasource for unit/context-load tests — no external infrastructure required.
# Integration tests that need real PostgreSQL use Testcontainers instead.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway disabled — H2 does not support the PostgreSQL-specific migration SQL.
spring.flyway.enabled=false

spring.jpa.hibernate.ddl-auto=none

# 32 zero bytes in Base64 — valid AES-256 key for tests only, never used in production.
encryption.key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

# JWT signing secret for tests only (must be >= 32 bytes for HS256).
jwt.secret=test-only-jwt-signing-secret-0123456789abcdefghijklmnop
