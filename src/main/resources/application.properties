spring.application.name=medsimple

# ── Database ──────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5333/medsimple}
spring.datasource.username=${DB_USERNAME:medsimple}
# Default matches docker-compose.yml. Override DB_PASSWORD in staging/production.
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver



# Flyway is the sole owner of schema state. Hibernate does not create or validate tables.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── Flyway ────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ── Encryption ────────────────────────────────────────────────
# AES-256-GCM key for PHI fields (health card numbers, insurance numbers).
# Default is 32 zero bytes — local dev only. Set ENCRYPTION_KEY in staging/production.
encryption.key=${ENCRYPTION_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}

# ── JWT ───────────────────────────────────────────────────────
# HS256 signing secret — at least 32 bytes. No default: must be set via JWT_SECRET
# (env var in prod, application-local.properties in local dev). Never commit the value.
jwt.secret=${JWT_SECRET}
# Token lifetimes are not secret — safe defaults committed, overridable by env var.
jwt.access-token-ttl-seconds=${JWT_ACCESS_TTL:900}
jwt.refresh-token-ttl-seconds=${JWT_REFRESH_TTL:2592000}

# ── Auth hardening ────────────────────────────────────────────
# Refresh token is delivered as an httpOnly cookie. secure=true requires https — keep
# true everywhere except local http dev (overridden in application-local.properties).
auth.refresh-cookie.secure=${AUTH_COOKIE_SECURE:true}
auth.refresh-cookie.same-site=${AUTH_COOKIE_SAMESITE:Strict}
# Login throttle: lock an email after N consecutive failures for M minutes.
auth.login.max-attempts=${AUTH_LOGIN_MAX_ATTEMPTS:5}
auth.login.lockout-minutes=${AUTH_LOGIN_LOCKOUT_MINUTES:15}

# ── Server ────────────────────────────────────────────────────
server.port=8080

# ── Media storage (patient photos + voice notes) ─────────────
# Backend selection: 'local' (default, files on disk) or 's3' (object store / Supabase Storage,
# active when credentials are configured via the supabase profile). Mirrors the real-adapter +
# fallback pattern used by every external integration.
media.storage.adapter=${MEDIA_STORAGE_ADAPTER:local}
# Where the local-disk adapter writes. Override in any real deployment to a persistent path.
media.storage.local.dir=${MEDIA_STORAGE_DIR:${java.io.tmpdir}/medsimple-media}
# Max accepted upload size in bytes (default 15 MiB). Enforced in MediaStorageService.
media.storage.max-bytes=${MEDIA_MAX_BYTES:15728640}

# Object-store (S3 / Supabase Storage) settings — only read when media.storage.adapter=s3.
# Real values live in the gitignored application-supabase.properties (see the .example template).
media.storage.s3.endpoint=${MEDIA_S3_ENDPOINT:}
media.storage.s3.region=${MEDIA_S3_REGION:us-east-1}
media.storage.s3.bucket=${MEDIA_S3_BUCKET:medsimple-media}
media.storage.s3.access-key=${MEDIA_S3_ACCESS_KEY:}
media.storage.s3.secret-key=${MEDIA_S3_SECRET_KEY:}

# Servlet multipart caps — keep above media.storage.max-bytes so the service returns a
# clean 413 instead of the container rejecting the request first.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ── Electronic lab requisition (FHIR) ─────────────────────────
# When a clinic has the LAB_ELECTRONIC capability, the requisition is sent as a FHIR R4
# ServiceRequest to this base URL. Empty by default (the adapter records SENT without transmitting);
# the local HAPI FHIR sandbox from docker-compose is http://localhost:8090/fhir.
lab.fhir.base-url=${LAB_FHIR_BASE_URL:}

# ── AI adapters ───────────────────────────────────────────────
# Each AI feature selects its adapter independently. Set to openai to use
# Spring AI ChatClient (GPT-4o); default fallback uses deterministic rules — no external calls.
ai.triage.adapter=${AI_TRIAGE_ADAPTER:fallback}
ai.safety.adapter=${AI_SAFETY_ADAPTER:fallback}
ai.referral.adapter=${AI_REFERRAL_ADAPTER:fallback}
ai.result.adapter=${AI_RESULT_ADAPTER:fallback}
# Voice transcription (Whisper) + photo analysis (GPT-4o vision) for symptom media.
ai.media.adapter=${AI_MEDIA_ADAPTER:fallback}

# ── Media processing (async voice/photo) ──────────────────────
# Background poller picks up PENDING voice/photo submissions and processes them.
media.processing.poller.enabled=${MEDIA_POLLER_ENABLED:true}
media.processing.poller.interval-ms=${MEDIA_POLLER_INTERVAL_MS:10000}

# Spring AI OpenAI config — only used when an ai.*.adapter is set to openai.
# Defaults to not-set so startup never fails when the fallback adapter is active.
spring.ai.openai.api-key=${OPENAI_API_KEY:not-set}
spring.ai.openai.chat.options.model=gpt-4o
spring.ai.openai.chat.options.temperature=0.2
