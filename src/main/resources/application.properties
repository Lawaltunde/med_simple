spring.application.name=medsimple

# ── Database ──────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5333/medsimple}
spring.datasource.username=${DB_USERNAME:medsimple}
# Default matches docker-compose.yml. Override DB_PASSWORD in staging/production.
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver



# Flyway is the sole owner of schema state. Hibernate does not create or validate tables.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── Flyway ────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ── Encryption ────────────────────────────────────────────────
# AES-256-GCM key for PHI fields (health card numbers, insurance numbers).
# Default is 32 zero bytes — local dev only. Set ENCRYPTION_KEY in staging/production.
encryption.key=${ENCRYPTION_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}

# ── Server ────────────────────────────────────────────────────
server.port=8080

# ── Supabase Storage (for voice notes and photos) ────────────
# supabase.url=https://your-project.supabase.co
# supabase.key=your-service-role-key
# supabase.storage.bucket=medsimple-media

# ── AI adapters ───────────────────────────────────────────────
# Each AI feature selects its adapter independently. Set to openai to use
# Spring AI ChatClient (GPT-4o); default fallback uses deterministic rules — no external calls.
ai.triage.adapter=${AI_TRIAGE_ADAPTER:fallback}
ai.safety.adapter=${AI_SAFETY_ADAPTER:fallback}

# Spring AI OpenAI config — only used when ai.triage.adapter=openai.
# Defaults to not-set so startup never fails when the fallback adapter is active.
spring.ai.openai.api-key=${OPENAI_API_KEY:not-set}
spring.ai.openai.chat.options.model=gpt-4o
spring.ai.openai.chat.options.temperature=0.2
