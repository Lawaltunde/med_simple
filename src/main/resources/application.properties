spring.application.name=medsimple

# ── Database ──────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5333/medsimple}
spring.datasource.username=${DB_USERNAME:medsimple}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver



# Flyway owns the schema — Hibernate only validates against it
# none: Flyway is the sole owner of schema state; Hibernate does not validate.
# Switch to validate once JPA entities exist and ordering is confirmed.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── Flyway ────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ── Server ────────────────────────────────────────────────────
server.port=8080

