services:
  db:
    container_name: medsimple-db
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medsimple
      POSTGRES_PASSWORD: password
      POSTGRES_DB: medsimple
    ports:
      - "5333:5432"
    restart: unless-stopped
    volumes:
      - medsimple_db:/var/lib/postgresql/data
    networks:
      - medsimple-network

  # Local FHIR R4 sandbox standing in for a lab network / OLIS endpoint. The electronic lab
  # adapter POSTs a real ServiceRequest here when a clinic has LAB_ELECTRONIC enabled and
  # lab.fhir.base-url points at it (http://localhost:8090/fhir). Demo/dev only.
  fhir-sandbox:
    container_name: medsimple-fhir-sandbox
    image: hapiproject/hapi:latest
    environment:
      hapi.fhir.fhir_version: R4
      hapi.fhir.allow_external_references: "true"
    ports:
      - "8090:8080"
    restart: unless-stopped
    networks:
      - medsimple-network

networks:
  medsimple-network:
    driver: bridge

volumes:
  medsimple_db: