<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MedSimple feature banner">
  <defs>
    <linearGradient id="b2bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#103A2E"/>
      <stop offset="1" stop-color="#0A2620"/>
    </linearGradient>
    <linearGradient id="b2tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1AA079"/>
      <stop offset="1" stop-color="#0E5C49"/>
    </linearGradient>
    <clipPath id="b2clip"><rect width="1200" height="360" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#b2clip)">
    <rect width="1200" height="360" fill="url(#b2bg)"/>

    <!-- connecting pulse line -->
    <path d="M0 206 H360 L380 206 L394 176 L410 236 L424 206 H800 L820 206 L834 176 L850 236 L864 206 H1200"
          fill="none" stroke="#1F6B55" stroke-width="2.5" opacity="0.7"/>

    <!-- logo lockup -->
    <rect x="64" y="40" width="44" height="44" rx="12" fill="url(#b2tile)"/>
    <path d="M75 64 H86 L90 53 L95 76 L100 59 L103 64 H109" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="120" y="70" font-family="system-ui,'Segoe UI',Roboto,Arial,sans-serif" font-weight="800" font-size="27" letter-spacing="-1"><tspan fill="#EAF6F1">Med</tspan><tspan fill="#5FD3AF">Simple</tspan></text>

    <text x="64" y="124" font-family="system-ui,'Segoe UI',Roboto,Arial,sans-serif" font-weight="800" font-size="34" letter-spacing="-1" fill="#FFFFFF">One assistant. Three ways to ask.</text>

    <!-- three feature columns -->
    <!-- col 1: Text it -->
    <g transform="translate(96,176)">
      <circle cx="34" cy="34" r="34" fill="#13503F"/>
      <rect x="16" y="22" width="36" height="26" rx="8" fill="none" stroke="#7FE3C4" stroke-width="3"/>
      <path d="M26 56 l0 -10 8 0 z" fill="#7FE3C4"/>
      <path d="M24 32 h20 M24 39 h13" stroke="#7FE3C4" stroke-width="3" stroke-linecap="round"/>
      <text x="86" y="28" font-family="system-ui,Arial,sans-serif" font-weight="700" font-size="22" fill="#FFFFFF">Text it</text>
      <text x="86" y="54" font-family="system-ui,Arial,sans-serif" font-size="15" fill="#9FC4B7">Ask anything about</text>
      <text x="86" y="74" font-family="system-ui,Arial,sans-serif" font-size="15" fill="#9FC4B7">your health.</text>
    </g>

    <!-- col 2: Photograph it -->
    <g transform="translate(496,176)">
      <circle cx="34" cy="34" r="34" fill="#13503F"/>
      <rect x="14" y="24" width="40" height="28" rx="7" fill="none" stroke="#7FE3C4" stroke-width="3"/>
      <path d="M26 24 l4 -6 8 0 4 6" fill="none" stroke="#7FE3C4" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="34" cy="38" r="8" fill="none" stroke="#7FE3C4" stroke-width="3"/>
      <text x="86" y="28" font-family="system-ui,Arial,sans-serif" font-weight="700" font-size="22" fill="#FFFFFF">Photograph it</text>
      <text x="86" y="54" font-family="system-ui,Arial,sans-serif" font-size="15" fill="#9FC4B7">Snap a photo and get</text>
      <text x="86" y="74" font-family="system-ui,Arial,sans-serif" font-size="15" fill="#9FC4B7">clarity in seconds.</text>
    </g>

    <!-- col 3: Speak it -->
    <g transform="translate(896,176)">
      <circle cx="34" cy="34" r="34" fill="#13503F"/>
      <g stroke="#7FE3C4" stroke-width="3.4" stroke-linecap="round">
        <path d="M22 34 v0"/><path d="M28 27 v14"/><path d="M34 20 v28"/><path d="M40 25 v18"/><path d="M46 31 v6"/>
      </g>
      <text x="86" y="28" font-family="system-ui,Arial,sans-serif" font-weight="700" font-size="22" fill="#FFFFFF">Speak it</text>
      <text x="86" y="54" font-family="system-ui,Arial,sans-serif" font-size="15" fill="#9FC4B7">Use your voice. We'll</text>
      <text x="86" y="74" font-family="system-ui,Arial,sans-serif" font-size="15" fill="#9FC4B7">take it from there.</text>
    </g>
  </g>
</svg>
