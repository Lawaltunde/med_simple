<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MedSimple hero banner">
  <defs>
    <linearGradient id="b1bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF8F3"/>
      <stop offset="1" stop-color="#D6EEE4"/>
    </linearGradient>
    <linearGradient id="b1panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15916F"/>
      <stop offset="1" stop-color="#0C4F3F"/>
    </linearGradient>
    <linearGradient id="b1tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1AA079"/>
      <stop offset="1" stop-color="#0E5C49"/>
    </linearGradient>
    <clipPath id="b1clip"><rect width="1200" height="420" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#b1clip)">
    <rect width="1200" height="420" fill="url(#b1bg)"/>

    <!-- logo lockup -->
    <rect x="64" y="46" width="50" height="50" rx="14" fill="url(#b1tile)"/>
    <path d="M77 73 H89 L93 60 L99 85 L104 66 L107 73 H114" fill="none" stroke="#fff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="126" y="82" font-family="system-ui,'Segoe UI',Roboto,Arial,sans-serif" font-weight="800" font-size="32" letter-spacing="-1"><tspan fill="#0E2C24">Med</tspan><tspan fill="#16876A">Simple</tspan></text>

    <!-- headline -->
    <text x="66" y="214" font-family="system-ui,'Segoe UI',Roboto,Arial,sans-serif" font-weight="800" font-size="64" letter-spacing="-2" fill="#0E2C24">Your family's</text>
    <text x="66" y="282" font-family="system-ui,'Segoe UI',Roboto,Arial,sans-serif" font-weight="800" font-size="64" letter-spacing="-2" fill="#0E2C24">health assistant.</text>

    <!-- subhead with pulse accent -->
    <path d="M68 330 H92 L100 312 L110 350 L118 330 H150" fill="none" stroke="#16876A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="68" y="372" font-family="system-ui,'Segoe UI',Roboto,Arial,sans-serif" font-weight="500" font-size="19" fill="#2C6B57">Text it. Photograph it. Speak it. MedSimple knows what to do.</text>

    <!-- right panel -->
    <rect x="760" y="40" width="400" height="340" rx="26" fill="url(#b1panel)"/>
    <circle cx="960" cy="210" r="152" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>
    <circle cx="960" cy="210" r="112" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
    <circle cx="960" cy="210" r="72" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
    <path d="M800 220 H892 L906 156 L928 286 L950 184 L964 220 H1120" fill="none" stroke="#7FE3C4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1120" cy="220" r="7" fill="#7FE3C4"/>

    <!-- floating chip: question -->
    <g>
      <rect x="800" y="84" width="236" height="58" rx="16" fill="#ffffff"/>
      <circle cx="830" cy="113" r="15" fill="#E7F5EF"/>
      <path d="M823 111 h14 M823 116 h9" stroke="#15916F" stroke-width="2.4" stroke-linecap="round"/>
      <text x="854" y="109" font-family="system-ui,Arial,sans-serif" font-weight="700" font-size="13" fill="#0E2C24">Is this rash normal?</text>
      <text x="854" y="127" font-family="system-ui,Arial,sans-serif" font-size="12" fill="#6C8A80">Tap to ask MedSimple</text>
    </g>

    <!-- floating chip: answer -->
    <g>
      <rect x="884" y="300" width="252" height="58" rx="16" fill="#0A3A2E"/>
      <circle cx="914" cy="329" r="15" fill="#13503F"/>
      <path d="M907 327 l5 5 9 -10" fill="none" stroke="#7FE3C4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="938" y="325" font-family="system-ui,Arial,sans-serif" font-weight="700" font-size="13" fill="#FFFFFF">Likely mild — here's what</text>
      <text x="938" y="343" font-family="system-ui,Arial,sans-serif" font-size="12" fill="#8FC6B6">to watch for next.</text>
    </g>
  </g>
</svg>
