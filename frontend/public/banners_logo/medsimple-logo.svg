<svg width="760" height="220" viewBox="0 0 760 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MedSimple logo">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1AA079"/>
      <stop offset="1" stop-color="#0E5C49"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0E5C49" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Icon tile -->
  <g filter="url(#soft)">
    <rect x="20" y="34" width="152" height="152" rx="40" fill="url(#tile)"/>
  </g>

  <!-- Heartbeat pulse forming an implied cross -->
  <path d="M44 116 H82 L92 80 L104 150 L116 94 L124 116 H148"
        fill="none" stroke="#FFFFFF" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- vertical accent of the medical cross -->
  <rect x="90" y="58" width="10" height="34" rx="5" fill="#FFFFFF" opacity="0.0"/>
  <circle cx="148" cy="116" r="7" fill="#7FE3C4"/>

  <!-- Wordmark -->
  <text x="206" y="138"
        font-family="system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-weight="800" font-size="78" letter-spacing="-2">
    <tspan fill="#0E2C24">Med</tspan><tspan fill="#16876A">Simple</tspan>
  </text>

  <!-- subtle pulse echo under the wordmark -->
  <path d="M210 164 H452 L464 164 L472 152 L482 178 L492 160 L500 164 H636"
        fill="none" stroke="#16876A" stroke-width="3.5"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
</svg>
